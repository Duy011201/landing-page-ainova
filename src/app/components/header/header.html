  <div class="header__card overflow-hidden flex align-items-center justify-content-center">
<!--    <div class="banner-before"></div>-->
<!--    <div class="banner-after"></div>-->
    <div class="wrap-content md:px-0 px-3 flex align-items-center gap-8">
      <img class="header__card--logo" src="assets/image/logo-06.png" alt="AINOVA Logo" />
      @if (!isMobile) {
        <div class="flex lg:gap-5 gap-3">
          <span class="header__card--item cursor-pointer px-3 py-2 font-bold" [routerLink]="SETTING.SYSTEM_PAGE.RELATED_HOME">Về chúng tôi</span>
          <span class="header__card--item cursor-pointer px-3 py-2 font-bold" [routerLink]="SETTING.SYSTEM_PAGE.RELATED_PRODUCT">Sản phẩm</span>
          <span class="header__card--item cursor-pointer px-3 py-2 font-bold" [routerLink]="SETTING.SYSTEM_PAGE.RELATED_SOLUTION">Giải pháp</span>
          <span class="header__card--item cursor-pointer px-3 py-2 font-bold" [routerLink]="SETTING.SYSTEM_PAGE.RELATED_TABLE_PRICE_TUHA">Bảng giá</span>
          <span class="header__card--item cursor-pointer px-3 py-2 font-bold" [routerLink]="SETTING.SYSTEM_PAGE.RELATED_CONTACT">Liên hệ</span>
        </div>
        <div class="flex align-items-center lg:gap-5 gap-3">
          <span class="app-btn px-4 border-1 border-white free-trial-button" (click)="onRippleButtonClick($event)" [routerLink]="SETTING.SYSTEM_PAGE.RELATED_CONTACT">Đăng ký ngay</span>
        </div>
      } @else {
        <p-sidebar [(visible)]="sidebarVisible" position="right" showCloseIcon="false">
          <div class="flex justify-content-between align-items-center">
            <div class="flex justify-content-start align-items-center">
              <span class="font-semibold text-2xl">AINOVA Việt Nam</span>
            </div>
            <i class="fa-solid fa-xmark cursor-pointer" (click)="sidebarVisible = false"></i>
          </div>

            <div class="header__card--mobile mt-3">
              <div class="mobile-item p-3 flex align-items-center justify-content-start h-4rem border-bottom-1 cursor-pointer"
                   style="border-bottom-color: var(--border-color-app)"
                   *ngFor="let item of fullMenu">
              <span [routerLink]="item.routerLink">
                <i [ngClass]="item.icon"></i> <span class="ml-3">{{ item.label }}</span>
              </span>
              </div>
            </div>
            <div class="flex justify-content-start align-items-center mt-5">
              <span class="app-content" style="font-size: 10px">
                VIET NAM AINOVA GROUP JOINT STOСК COMPANY
                <br>
                © 2025 All Rights Reserved
              </span>
            </div>
        </p-sidebar>
      }
      <i *ngIf="isMobile" (click)="toggleSidebar()" class="fa-solid fa-bars text-2xl"></i>
    </div>
  </div>
</header>
